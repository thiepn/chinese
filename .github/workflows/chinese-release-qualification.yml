name: Chinese release qualification
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    name: Original source tests and offline build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned free build tooling
        run: npm install --no-audit --no-fund
      - name: Source regression suite
        run: npm test
      - name: Emit source-backed HSK 3.0 target coverage matrix
        run: node scripts/hsk3_source_coverage.mjs
      - name: Source-to-dist and offline manifest
        run: npm run build && npm run verify
  chromium:
    name: Isolated local-origin Chromium acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned free build tooling
        run: npm install --no-audit --no-fund
      - name: Install isolated Playwright browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Build exact checked-out source
        run: npm run build && npm run verify
      - name: Local HTTP browser qualification
        run: |
          npm run serve >/tmp/chinese-serve.log 2>&1 &
          python - <<'PY'
          import time, urllib.request
          for _ in range(80):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:4173/',timeout=1) as r:
                      assert r.status==200
                  break
              except Exception:
                  time.sleep(0.25)
          else:
              raise RuntimeError('Local source server did not start')
          PY
          python scripts/c9_browser_acceptance.py --expected-head "${{ github.sha }}" --chromium "$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" --artifacts /tmp/chinese-acceptance
      - name: Local device-readiness cache repair and offline reload
        run: python scripts/c9_device_offline_acceptance.py
      - name: Real two-tab backup and restore conflict acceptance
        run: python scripts/c9_cross_tab_backup_acceptance.py
      - name: Original P75/P77 editorial-source and mobile accessibility acceptance
        run: python scripts/c9_dialogue_editorial_acceptance.py
      - name: Local Mandarin turn-specific playback and mobile a11y acceptance
        run: python scripts/c9_dialogue_turn_playback_acceptance.py
      - name: F1 source-backed grammar and translation desktop/mobile acceptance
        run: python scripts/c9_f1_educational_acceptance.py
      - name: F2 native source-to-grammar/word three-stage Chromium transfer
        run: python scripts/c9_f2_transfer_acceptance.py
      - name: F3 original source-owned Pinyin and contextual evidence desktop/mobile acceptance
        run: python scripts/c9_f3_source_pronunciation_acceptance.py
      - name: F4 original Mandarin source fidelity and answer evidence desktop/mobile acceptance
        run: python scripts/c9_f4_source_accuracy_acceptance.py
      - name: HSK target direct-entry local Chromium desktop/mobile acceptance
        run: python scripts/c9_hsk_free_entry_acceptance.py
      - name: HSK original grammar reading dialogue desktop/mobile source handoff
        run: python scripts/c9_hsk_skill_source_acceptance.py
      - name: Preserve public-only UI acceptance screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chinese-c9-local-ui-screenshots
          path: /tmp/chinese-acceptance/*.png
          retention-days: 7
          if-no-files-found: warn
